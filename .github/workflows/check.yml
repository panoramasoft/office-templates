# Checks every pull request with the app's own template rules. Runs on pull_request only, never
# pull_request_target: a pull request from a fork gets no secrets and a read-only token, and
# this workflow needs neither. CI never holds the signing key and never signs anything.
name: Check templates

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: built/ is exactly what templates/ builds to
        run: node scripts/build.ts --check
      - name: The app's rules (format, sizes, hidden characters; addresses and warnings for the reviewer)
        run: node scripts/check.ts
      - name: index.json, if present, is signed with a key listed on main
        run: node scripts/verify.ts
      - name: The scripts refuse what they must (make-index, sign, verify, keygen)
        run: node --test test/
